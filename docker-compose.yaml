version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: devops_dashboard_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: devops_dashboard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: devops_dashboard_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: